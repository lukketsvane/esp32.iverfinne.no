<style>:root{color-scheme:dark;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#000;color:#aaa}body{margin:0;min-height:100dvh;display:grid;place-items:center;text-align:center;padding:76px 24px 32px;box-sizing:border-box}main{width:min(100%,320px);display:grid;gap:20px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}p{margin:0;line-height:1.6}#status:empty,#model-status:empty{display:none}progress{display:block;width:148px;height:2px;border:0;margin:18px auto;background:#ffffff18;accent-color:#aaa}progress::-webkit-progress-bar{background:#ffffff18}progress::-webkit-progress-value{background:#aaa}section{display:grid;gap:16px}.network{display:grid;gap:16px}.network img{width:200px;max-width:100%;height:auto;justify-self:center}code{font:inherit;color:#ddd;user-select:all}details{font-size:12px;line-height:1.6;color:#999}button,#open-camera{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;text-decoration:none;font:inherit;color:#ddd;background:transparent;border:0;padding:0 16px;cursor:pointer}#open-camera{width:100%;box-sizing:border-box;background:transparent;color:#ddd}#retry{margin:12px auto 0}button:disabled,#open-camera[aria-disabled="true"]{opacity:.5;cursor:default}#back{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));width:44px;height:44px;display:grid;place-items:center;color:#aaa;text-decoration:none}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.3}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #aaa;outline-offset:4px}summary{display:flex;align-items:center;justify-content:center;gap:8px;list-style:none;min-height:44px;margin:auto;cursor:pointer}summary::after{content:'+'}details[open]>summary::after{content:'−'}summary::-webkit-details-marker{display:none}details p{margin:12px 0 0}#model-options{border-top:1px solid #ffffff18;padding-top:8px}#model-status{color:#ccc}[hidden]{display:none!important}</style>
<main>

<h1 id="connection-title" class="sr">Kople til kameraet</h1>
