<!doctype html>
<html lang="nn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Entropi</title>
<style>:root{color-scheme:dark;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#000;color:#aaa}body{margin:0;min-height:100dvh;display:grid;place-content:center;text-align:center;padding:30px;box-sizing:border-box}main{width:min(100%,300px);display:grid;gap:22px}p{margin:0;line-height:1.6}progress{width:148px;height:1px;border:0;background:#ffffff18;justify-self:center;accent-color:#aaa}progress::-webkit-progress-bar{background:#ffffff18}progress::-webkit-progress-value{background:#aaa}section{display:grid;gap:22px}.network{padding:18px;border:1px solid #ffffff18;display:grid;gap:7px}.network strong{font-size:22px;font-weight:500;letter-spacing:.08em;color:#ddd}.network span,details{font-size:12px;line-height:1.6;color:#888}button{font:inherit;color:#ddd;background:transparent;border:1px solid #ffffff30;padding:14px 20px;cursor:pointer}button:focus-visible,summary:focus-visible{outline:1px solid #aaa;outline-offset:4px}summary{cursor:pointer}details p{margin-top:12px}[hidden]{display:none!important}</style>
<main>
<p id="status" role="status" aria-live="polite">Klargjer telefonen …</p>
<progress id="progress" max="100" aria-label="Klargjering"></progress>
<section id="ready" hidden>
<div class="network"><span>Wi-Fi</span><strong>ENTROPI</strong><span>Utan passord · utan internett</span></div>
<p id="connection-hint">Kople til dette nettet. Kom tilbake hit i Safari.</p>
<button id="open-camera">Opne kameraet ↗</button>
<details><summary>Treng du hjelp?</summary><p>Bruk Safari. Om kameraet ikkje opnar seg, skriv http://192.168.4.1 i adresselinja etter at du har kopla til ENTROPI.</p></details>
</section>
<button id="retry" hidden>Prøv igjen</button>
</main>
<script type="module" src="/prepare/app.mjs"></script>
</html>
