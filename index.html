<!doctype html>
<html lang="nn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Eit foto, ei lita romleg skisse. Kamera og djupneberekning på telefonen.">
<title>Entropi</title>
<link rel="stylesheet" href="/style.css">
<main id="studio">
  <header><button id="back" class="icon" aria-label="Tilbake til kamera" hidden>←</button><span class="brand">ENTROPI</span><button id="camera" class="quiet">Start kamera</button></header>
  <section id="finder" aria-label="Søkjar"><canvas id="viewfinder"></canvas><i class="cross" aria-hidden="true"></i></section>
  <button id="capture-plane" aria-label="Ta foto" disabled></button>
  <section id="review" aria-label="Foto og 3D" hidden><img id="photo" alt="Fotoet ditt"><div id="scene" hidden></div></section>
  <p id="status" role="status" aria-live="polite">Opne kameraet eller vel eit foto.</p>
  <footer id="capture-controls"><button id="upload" class="quiet">Vel foto</button><button id="capture" aria-label="Ta foto" disabled></button><a class="quiet" href="http://192.168.4.1/" target="_blank" rel="noopener">ESP32 ↗</a></footer>
  <footer id="review-controls" hidden><button id="toggle" class="icon" aria-label="Vis foto" title="Vis foto" hidden></button><button id="save" aria-label="Lagre foto" title="Lagre foto"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg></button></footer>
  <input id="file" type="file" accept="image/*" hidden>
  <video id="video" playsinline muted hidden></video>
</main>
<script type="module" src="/app.mjs"></script>
</html>
