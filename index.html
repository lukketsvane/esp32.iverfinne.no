<!doctype html>
<html lang="nn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Eit foto, ei lita romleg skisse. Kamera og djupneberekning på telefonen.">
<title>Entropi</title>
<link rel="stylesheet" href="/style.css">
<main id="studio" class="studio camera">
  <video id="video" autoplay muted playsinline aria-hidden="true" tabindex="-1"></video>
  <div id="finder" class="finder" aria-hidden="true"><canvas id="viewfinder"></canvas><i class="cross"></i><div id="progress" class="progress indeterminate" hidden><i></i></div></div>
  <button id="capture-plane" class="capture-plane" type="button" aria-label="Opne kameraet"></button>
  <div id="scene" class="cloud hidden" role="img" aria-label="3D-scene. Dra for å rotere, klyp for å zoome. Dobbelttrykk for eit nytt foto."></div>
  <button id="retry" class="retry-plane" type="button" aria-label="Prøv igjen" hidden><i class="retry-mark" aria-hidden="true"></i></button>
  <button id="reset" class="access-control" type="button" aria-label="Ta eit nytt foto" hidden><i class="plus" aria-hidden="true"></i></button>
  <button id="save" class="access-control download" type="button" aria-label="Lagre originalfoto" hidden><i class="download-mark" aria-hidden="true"></i></button>
  <span id="status" class="sr-only" role="status" aria-live="polite"></span>
</main>
<script type="module" src="/app.mjs"></script>
</html>
