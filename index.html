<!doctype html>
<html lang="nn">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entropi">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/pwa-ui.css">
<link rel="stylesheet" href="/vendor/marigold.css">
<script type="module" src="/pwa.mjs"></script>
<meta name="description" content="Eit foto, ei lita romleg skisse. Kamera og djupneberekning på telefonen.">
<title>VATHOgraphy · ENTROPI</title>
<link rel="stylesheet" href="/style.css">
<main id="studio" class="studio camera"><header class="pwa-heading"><div class="pwa-camera-actions"><button id="flip-camera" type="button" aria-label="Byt kamera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3m3 3-3 3M20 16H7l3-3m-3 3 3 3"/></svg></button><button id="phone-timer" type="button" data-delay="0" aria-label="Utløysar utan forsinking"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg></button></div></header>
  <video id="video" autoplay muted playsinline aria-hidden="true" tabindex="-1"></video>
  <div id="finder" class="finder" aria-hidden="true"><canvas id="viewfinder"></canvas><i class="cross"></i><div id="progress" class="progress indeterminate" aria-hidden="true" hidden><svg viewBox="0 0 100 150" preserveAspectRatio="none"><rect id="progress-bar" x=".5" y=".5" width="99" height="149" pathLength="100"/></svg></div></div>
  <img id="photo" class="photo" alt="Svart-kvitt foto" hidden>
  <button id="capture-plane" class="capture-plane" type="button" aria-label="Opne kameraet"></button>
  <div id="scene" class="cloud hidden" role="img" aria-label="3D-scene. Dra for å rotere, klyp for å zoome. Dobbelttrykk for eit nytt foto."></div>
<div id="marigold-view" class="mg-view" role="group" aria-label="VATHOgraphy" hidden>
<img class="mg-output" alt="" aria-hidden="true"><img class="mg-original" alt="" aria-hidden="true"><div class="mg-seam" role="slider" aria-label="Samanlikningsgrense" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" tabindex="0"></div>
<div class="mg-variants" role="group" aria-label="VATHOgraphy-uttrykk"></div>
<button class="mg-compare" aria-label="Samanlikn med originalfoto" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 3h18v18H3zM3 3h9v18H3z"/></svg></button></div>
  <button id="retry" class="retry-plane" type="button" aria-label="Prøv igjen" hidden><i class="retry-mark" aria-hidden="true"></i></button>
  <button id="reset" class="access-control new-photo" type="button" aria-label="Ta eit nytt foto" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
  <button id="recenter" class="access-control recenter" type="button" aria-label="Sentrer visinga" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4m0 10v4M3 12h4m10 0h4"/><circle cx="12" cy="12" r="5"/></svg></button>
  <button id="last-photo" class="access-control" type="button" aria-label="Opne siste foto" hidden><img id="thumbnail" alt=""></button>
  <button id="save" class="access-control download" type="button" aria-label="Lagre biletet" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg></button>
  <button id="print" class="access-control print" type="button" aria-label="Skriv ut" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7z"/></svg></button>
  <a class="access-control device-link" href="/start/?camera" aria-label="Kople til ESP32-kameraet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a14 14 0 0 1 18 0M6 12a9 9 0 0 1 12 0M9 15a4 4 0 0 1 6 0M12 19h.01"/></svg></a>
  <footer class="pwa-bottom"><button id="open-gallery" type="button" aria-label="Opne fotoarkivet"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="m3 10 6-3 6 3 6-3M8 14h8"/></svg></button><button id="phone-shutter" class="pwa-shutter" type="button" aria-label="Opne kameraet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h4l2-3h4l2 3h4v14H4z"/><circle cx="12" cy="12" r="4"/></svg></button></footer>
  <span id="phone-state" class="sr-only" role="status" aria-live="polite"></span>
  <span id="status" class="sr-only" role="status" aria-live="polite"></span>
  <span id="print-status" class="sr-only" role="status" aria-live="polite"></span>
</main>
<section id="phone-vault" class="phone-vault" role="dialog" aria-label="Fotoarkiv" aria-modal="true" hidden><header class="phone-vault-top"><button id="phone-vault-import" type="button" aria-label="Opne Entropi-fil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></svg></button><button id="phone-vault-close" type="button" aria-label="Lukk fotoarkivet"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><p id="phone-vault-status" class="sr-only" role="status" aria-live="polite"></p><div id="phone-vault-grid" class="phone-vault-grid"></div><div id="phone-vault-detail" class="phone-vault-detail" hidden><span class="archive-pending-mark" aria-hidden="true"></span><img id="phone-vault-image" alt="Arkivert foto"><div class="phone-vault-toolbar"><button id="phone-vault-edit" type="button" aria-label="Framkall Entropi-biletet" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 17 13-13 3 3L7 20H4zM14 7l3 3"/></svg></button><button id="phone-vault-save" type="button" aria-label="Lagre original"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg></button><button id="phone-vault-remove" type="button" aria-label="Slett"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6m4-6v6"/></svg></button><button id="phone-vault-back" type="button" aria-label="Alle bilete"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z"/></svg></button></div></div></section>
<script type="module" src="/app.mjs"></script>
</html>
