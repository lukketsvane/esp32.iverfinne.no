name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python -m unittest discover -s local -p test_bridge.py
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json
      FQBN: esp32:esp32:esp32cam:PartitionScheme=huge_app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python device/build-ui.py
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: arduino-esp32-3.3.12
      - run: arduino-cli core update-index --additional-urls "$ESP32_INDEX"
      - run: arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$ESP32_INDEX"
      - name: Primary camera
        run: arduino-cli compile --fqbn "$FQBN" --build-path build/primary device/EntropiCamera
      - name: Second camera
        run: arduino-cli compile --fqbn "$FQBN" --build-property "compiler.cpp.extra_flags=-DENTROPI_SECONDARY_CAMERA=1" --build-path build/secondary device/EntropiCamera
      - name: Primary with USB stereo commands
        run: arduino-cli compile --fqbn "$FQBN" --build-property "compiler.cpp.extra_flags=-DENTROPI_USB_STEREO_TEST=1" --build-path build/usb device/EntropiCamera
