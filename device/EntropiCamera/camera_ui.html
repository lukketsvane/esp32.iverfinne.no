<script>

},()=>!onboarding.open,()=>{reviewDown=reviewTap=null},{vathography:true,photo:profileIndex('photo'),primitive:profileIndex('depth')});

photoView.setPalette(paletteSelection.photo);finder.setPalette(paletteSelection.photo);

let liveGestures=null;

const printClient=createPrintClient({devicePrinter:createDevicePrinter(),buildJob:cloudPrintJob,report:printFeedback});
const reviewing=()=>photoDialog.open;
function notice(text,transient=false){clearTimeout(noticeTimer);$('notice').textContent=text;if(transient)noticeTimer=setTimeout(()=>{$('notice').textContent=''},4500)}

  if(printBusy||!photoDialog.open||!photoBlob||studioControls.image===1&&!sceneVisible||studioControls.image===2&&!artVisible)return;

  ++connectGeneration;connecting=false;clearTimeout(retryTimer);
  printBusy=true;stopStream();controls();refreshReview();printFeedback('');
  try{await printClient.print(mode===0?photoView.snapshot(photoGestures.state):source.snapshot(false),()=>photoDialog.open&&photoBlob===blob&&studioControls.image===mode&&(mode===0||mode===1&&source===sceneViewer&&sceneVisible||mode===2&&marigoldView.ready&&!artError&&marigoldView.result===artResult))}

function notifyCamera(type){

    if(type==='entropi-camera-ready'){parentPort?.close();const channel=new MessageChannel();parentPort=channel.port1;window.opener.postMessage({type},'https://esp32.iverfinne.no',[channel.port2])}

  }catch{parentPort?.close();parentPort=null;parentReady=false}

function controls(){

  $('last-photo').disabled=busy;$('progress').hidden=!(busy||printBusy);
  studio.classList.toggle('connected',connected);studio.classList.toggle('reconnecting',connecting);
  studio.classList.toggle('capturing-splats',busy&&studioControls.image!==0);
  $('connection-label').textContent=connected?'Tilkopla':connecting?'Koplar til':deviceStatus?'Kamera ikkje klart':'Fråkopla';
  updateCameraChrome();

function stopSecond(){secondTask?.abort();secondTask=null;secondEnabled=false}
function disconnectSecond(){stopSecond();if(secondAutoMode&&!busy&&!reviewing())studioControls.setImage(0);controls()}
function peerId(){const id=deviceStatus?.peer?.camera_id;return typeof deviceStatus?.camera_id==='string'&&typeof id==='string'&&/^[a-f0-9]{12}$/.test(deviceStatus.camera_id)&&/^[a-f0-9]{12}$/.test(id)&&id!==deviceStatus.camera_id?id:''}
async function connectSecond(){
  if(!connected||connecting||busy||printBusy||reviewing()||document.hidden)return;
  const expected=peerId();if(!expected){disconnectSecond();return}
  if(secondId!==expected)disconnectSecond();else if(secondTask)return;
  secondId=expected;const task=new AbortController();secondTask=task;let url;
  try{
    const status=await request('/peer/status','json',5000,task.signal);task.signal.throwIfAborted();
    if(!validStatus(status)||!status.camera_ready||!status.stream_ready)throw new Error('Kamera 2 er ikkje klart.');
    if(status.camera_id!==expected||peerId()!==expected)throw new Error('Ugyldig kamera 2.');
    const blob=await request('/peer/preview?t='+Date.now(),'blob',5000,task.signal);task.signal.throwIfAborted();
    if(blob.type!=='image/jpeg'||!blob.size)throw new Error('Ingen bilete frå kamera 2.');
    const image=new Image();url=URL.createObjectURL(blob);image.src=url;await image.decode();task.signal.throwIfAborted();
    if(!image.naturalWidth||!image.naturalHeight||peerId()!==expected)throw new Error('Ugyldig bilete frå kamera 2.');
    if(secondTask!==task||!connected||busy||printBusy||reviewing()||document.hidden)return;
    secondEnabled=true;
    if(!secondSelected){secondSelected=true;if(!imageRevision&&studioControls.image===0){studioControls.setImage(1);secondAutoMode=true}}
  }catch{if(!task.signal.aborted&&secondTask===task)disconnectSecond()}
  finally{if(url)URL.revokeObjectURL(url);if(secondTask===task)secondTask=null;controls()}
}
async function capturePair(signal){

  const urls=[];
