  if(!phoneReady&&!photoPair){if(!phoneTask)void checkPhone();refreshReview();return}
  const generation=sceneGeneration,task=new AbortController();sceneTask=task;needsSetup=false;sceneError='';refreshReview();
  const report=update=>{if(generation===sceneGeneration&&studioControls.image===1){$('scene-progress').classList.toggle('indeterminate',update.percent===undefined);$('scene-progress-bar').style.strokeDasharray=Number.isFinite(update.percent)?Math.max(0,Math.min(100,update.percent))+' 100':'';refreshReview()}};
  try{
    task.signal.throwIfAborted();
    const result=await createDepthScene($('scene'),photoPair?.left??photoBlob,report,task.signal,2,photoPair?.right);
    if(generation!==sceneGeneration){result.dispose();return}
    sceneViewer=result;sceneViewer.onError=error=>{if(sceneViewer===result){sceneError=error.message||'3D-visinga vart avbroten. Prøv igjen.';refreshReview()}};sceneViewer.setPrimitiveLevel(COLOR_SCHEMES[studioControls.primitive].primitive);sceneViewer.setPalette(paletteSelection.depth);
  }catch(error){
    if(task.signal.aborted||generation!==sceneGeneration)return;
    needsSetup=error.code==='PHONE_SETUP_REQUIRED';
    if(needsSetup){phoneReady=false;controls();if(photoDialog.open&&studioControls.image===1)showOnboarding()}
    else if(photoPair&&secondAutoMode){
      studioControls.setImage(0);
      printFeedback(archiveWarning||'For få sikre samsvar til 3D. Hald motivet stille og prøv med meir lys. Fotoet og stereoparet kan framleis lagrast.');
    }else sceneError=error.message||'Kunne ikkje lage 3D. Prøv igjen.';
  }finally{if(sceneTask===task){sceneTask=null;refreshReview();if(sceneVisible)void persistCurrentPreview().catch(error=>printFeedback(error.message))}}
}
